<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>临安皇城 · 三维历史漫游</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#151c1a;color:#f4ebd7;font-family:system-ui,'PingFang SC',sans-serif}#scene{position:fixed;inset:0}#panel{position:absolute;left:18px;top:18px;width:300px;max-width:calc(100vw - 60px);background:#15231fe8;border:1px solid #a48c5c77;border-radius:12px;padding:18px;box-shadow:0 12px 40px #0007}h1{font-size:21px;margin:0 0 5px;color:#e9d29b}small{color:#c6baa0}p{line-height:1.65;font-size:13px}button{background:#30483e;color:#f5ebd6;border:1px solid #99865c;border-radius:6px;padding:9px 12px;cursor:pointer;margin:4px 3px 4px 0}button:hover,button.active{background:#8a6937}#info{margin-top:12px;padding-top:12px;border-top:1px solid #86745477;min-height:90px}#legend{position:absolute;bottom:16px;right:16px;background:#14221edb;padding:12px;border-radius:8px;font-size:12px;max-width:310px}#mini{width:100%;max-height:140px;object-fit:contain;background:#e7d9bc;margin-top:8px;cursor:pointer}a{color:#e5c88c}#hide{position:absolute;top:12px;right:12px}body.collapsed #panel{width:auto;padding:8px}body.collapsed #panel>*:not(#hide){display:none}@media(max-width:650px){#panel{width:245px;padding:12px}h1{font-size:17px}#legend{left:10px;right:10px;bottom:8px}}</style></head><body><div id="scene"></div><aside id="panel"><button id="hide">收起</button><h1>临安皇城 · 3D 漫游</h1><small>根据所提供《京城图》绘制的概念性历史复原</small><p>地图方位按原图画面固定：左侧为凤凰山与大内，右侧为城市街巷。可旋转视角，但建筑位置不随视角重新排列。</p><button id="bird" class="active">鸟瞰全城</button><button id="walk">步行游览</button><button id="reset">复位视角</button><button id="labels" class="active">地名标注</button><div id="info"><strong>点击场景中的建筑或地块</strong><p>查看区域的用途、历史背景和复原可信程度。</p></div><img id="mini" src="reference.jpg" title="查看原始地图"><small>原图对照 · 点击放大</small></aside><div id="legend">鼠标左键拖动：旋转　滚轮：缩放　右键拖动：平移<br>步行模式：W/A/S/D 移动，鼠标拖动转向。<br>黄色标签为地图可辨认的地名；三维建筑形态为示意性复原。</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script>window.addEventListener("error",e=>{document.getElementById("info").innerHTML="<strong>场景加载失败</strong><p>"+String(e.message)+"</p>"});window.addEventListener("unhandledrejection",e=>{document.getElementById("info").innerHTML="<strong>3D 模块加载失败</strong><p>请检查网络能否访问 cdn.jsdelivr.net，或尝试其他网络。</p>"})</script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb4c6bd);scene.fog=new THREE.Fog(0xb4c6bd,170,340);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,600);camera.position.set(-70,115,135);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('scene').appendChild(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.target.set(0,0,0);orbit.maxPolarAngle=Math.PI/2.07;orbit.minDistance=12;orbit.maxDistance=245;scene.add(new THREE.HemisphereLight(0xfff2dc,0x526e60,2.1));const sun=new THREE.DirectionalLight(0xffe6b2,2.4);sun.position.set(-50,100,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-150;sun.shadow.camera.right=150;sun.shadow.camera.top=150;sun.shadow.camera.bottom=-150;scene.add(sun);
const mats={grass:new THREE.MeshStandardMaterial({color:0x728a60}),ground:new THREE.MeshStandardMaterial({color:0xa9a17b}),wall:new THREE.MeshStandardMaterial({color:0xd2c2a0}),roof:new THREE.MeshStandardMaterial({color:0x343d39,roughness:.85}),red:new THREE.MeshStandardMaterial({color:0x843d30}),road:new THREE.MeshStandardMaterial({color:0xc5b68f}),water:new THREE.MeshStandardMaterial({color:0x719da0,transparent:true,opacity:.85}),hill:new THREE.MeshStandardMaterial({color:0x536e4d})};const objects=[],labels=[];function box(x,y,z,w,h,d,mat,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}box(0,-1,0,220,2,145,mats.ground);function path(x,z,w,d){box(x,.06,z,w,.12,d,mats.road)}function label(name,x,z){const c=document.createElement('canvas');c.width=512;c.height=96;const ctx=c.getContext('2d');ctx.fillStyle='#24342ddf';ctx.fillRect(0,0,512,96);ctx.strokeStyle='#cfb47c';ctx.strokeRect(2,2,508,92);ctx.fillStyle='#f9e8bc';ctx.font='bold 44px serif';ctx.textAlign='center';ctx.fillText(name,256,63);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.position.set(x,14,z);s.scale.set(16,3,1);scene.add(s);labels.push(s)}
function building(name,x,z,w=9,d=7,h=5,desc='',confidence='推测性建筑复原'){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(0,h/2,0,w,h,d,mats.wall,g);for(let i=-w/2+1.2;i<w/2;i+=2.3){box(i,h*.45,d/2+.12,.35,h*.85,.45,mats.red,g);box(i,h*.45,-d/2-.12,.35,h*.85,.45,mats.red,g)}box(0,h+.25,0,w+2,.55,d+2,mats.roof,g);const roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.76,2.5,4),mats.roof);roof.rotation.y=Math.PI/4;roof.scale.set(w/Math.max(w,d),1,d/Math.max(w,d));roof.position.y=h+1.45;roof.castShadow=true;g.add(roof);g.userData={name,desc,confidence};g.traverse(o=>{if(o.isMesh){o.userData.owner=g;objects.push(o)}});label(name,x,z);return g}
// The historical map is arranged with palace and mountain on the left, commercial city on the right.
// Model axes: x increases rightward on the original image; z increases downward.
path(-18,9,170,7);path(50,-17,7,110);path(5,42,155,6);path(65,18,4,98);path(25,-48,130,5);
// Palace enclosure at the left (Danei), open mountainous terrain at upper left.
box(-62,1,-2,3,5,105,mats.wall);box(-92,1,50,62,5,3,mats.wall);box(-92,1,-54,62,5,3,mats.wall);box(-121,1,-2,3,5,105,mats.wall);building('大内正门',-62,20,10,7,9,'皇城宫门与内外交通节点。门的具体立面依据宋代风格示意。','地名和宫城位置有地图依据；造型推测');building('皇城大内',-93,7,17,12,10,'皇帝起居、朝政及宫廷活动的核心区域。原图以「大内」标示此范围。','大内位置有地图依据；单体建筑位置为示意');building('宫廷殿宇',-95,-20,14,10,7,'代表皇城内多重殿宇、院落和礼制空间，并非某一座可确认的原址建筑。');building('宫内院落',-93,32,11,9,5,'示意宫城中由院墙、殿阁和通道组成的层次。');
// Phoenix mountain as a sculptural landmark
for(let i=0;i<18;i++){let x=-113+(i%5)*8,z=-57+Math.floor(i/5)*10;let r=7+(i%3)*3;const m=new THREE.Mesh(new THREE.ConeGeometry(r,10+(i%4)*4,7),mats.hill);m.position.set(x,4,z);m.rotation.y=i*.7;scene.add(m)}label('凤凰山',-102,-48);
// East of palace, approximate named zones from map
building('吴山',-43,-35,9,8,6,'原图标注吴山；这里以山麓建筑作为地名提示，不表示吴山顶存在此殿。');building('太庙',-39,-3,13,11,7,'王朝祭祀祖先的礼制场所。','名称在地图可辨；形制推测');building('官署区域',-38,31,12,8,6,'皇城附近官署与服务设施的概念性布局。');building('街市',-8,-31,11,8,5,'临安城市街巷和商业生活的示意空间。');building('御街',7,12,10,8,6,'联系宫城与城市的主要道路系统；此处为导览锚点，并非精确道路断面。');building('城门',81,4,12,9,9,'城墙与城门组织内外交通，兼具防御和管理功能。');
for(let i=0;i<60;i++){let x=8+(i%10)*8,z=-54+Math.floor(i/10)*17;if((x>43&&x<57)||(z>0&&z<17))continue;let w=4.5+(i%3),d=5+(i%2);const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(0,2,0,w,4,d,mats.wall,g);box(0,4.4,0,w+1,.8,d+1,mats.roof,g)}
// eastern urban wall
box(92,2,0,3,6,112,mats.wall);box(0,2,-64,187,6,3,mats.wall);box(0,2,63,187,6,3,mats.wall);
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{if(Math.abs(e.clientX-(window.lastDownX??e.clientX))>5)return;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);let hits=ray.intersectObjects(objects);if(hits.length){const d=hits[0].object.userData.owner.userData;document.getElementById('info').innerHTML=`<strong>${d.name}</strong><p>${d.desc}</p><small>史料说明：${d.confidence}</small>`}});renderer.domElement.addEventListener('pointerdown',e=>window.lastDownX=e.clientX);
let walk=false;const keys={};window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function mode(v){walk=v;orbit.enabled=!v;document.getElementById('bird').classList.toggle('active',!v);document.getElementById('walk').classList.toggle('active',v);if(v){camera.position.set(-65,3,24);camera.lookAt(-70,3,0)}else{camera.position.set(-70,115,135);orbit.target.set(0,0,0);orbit.update()}}document.getElementById('bird').onclick=()=>mode(false);document.getElementById('walk').onclick=()=>mode(true);document.getElementById('reset').onclick=()=>mode(false);document.getElementById('labels').onclick=e=>{const show=!labels[0].visible;labels.forEach(s=>s.visible=show);e.target.classList.toggle('active',show)};document.getElementById('hide').onclick=()=>{document.body.classList.toggle('collapsed');document.getElementById('hide').textContent=document.body.classList.contains('collapsed')?'展开':'收起'};document.getElementById('mini').onclick=()=>window.open('reference.jpg','_blank');let dragging=false,px=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX});window.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointermove',e=>{if(walk&&dragging){camera.rotation.order='YXZ';camera.rotation.y-=(e.clientX-px)*.004;px=e.clientX}});let last=performance.now();function animate(t){requestAnimationFrame(animate);let dt=Math.min((t-last)/1000,.05);last=t;if(walk){const v=new THREE.Vector3();camera.getWorldDirection(v);v.y=0;v.normalize();const side=new THREE.Vector3().crossVectors(v,new THREE.Vector3(0,1,0)).normalize();if(keys.w||keys.arrowup)camera.position.addScaledVector(v,16*dt);if(keys.s||keys.arrowdown)camera.position.addScaledVector(v,-16*dt);if(keys.a)camera.position.addScaledVector(side,-16*dt);if(keys.d)camera.position.addScaledVector(side,16*dt);camera.position.y=3;camera.position.x=THREE.MathUtils.clamp(camera.position.x,-130,100);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-70,70)}else orbit.update();renderer.render(scene,camera)}requestAnimationFrame(animate);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
